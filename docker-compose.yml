services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports: 
      - 5000:5000
    env_file:
      - .backend-env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage

  database:
    image: postgres:17
    env_file:
      - .db-env
    ports:
      - 5433:5432 
    volumes:
      - postgre_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    
volumes:
  postgre_data:
  storage_data: