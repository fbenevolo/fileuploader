name: Build Template

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

      service-path:
        required: true
        type: string

      lambda-name:
        required: true
        type: string


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: 3.12
            # usa caching de dependências para agilizar a execução do workflow
            cache: pip
            cache-dependency-path: ${{ inputs.service-path }}/requirements.txt

        - name: Install dependencies
          # usar python garante que o pip pertence ao interpretador configurado 
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r ${{ inputs.service-path }}/requirements.txt
    
        - name: Run ruff
          run: |
            ruff format --check ${{ inputs.service-path }}/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          # usa caching de dependências para agilizar a execução do workflow
          cache: pip
          cache-dependency-path: ${{ inputs.service-path }}/requirements.txt

      - name: Install dependencies
        # usar python garante que o pip pertence ao interpretador configurado 
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ inputs.service-path }}/requirements.txt
  
      - name: Run Tests
        run: |
          cd ${{ inputs.service-path }}/tests
          pytest -v

