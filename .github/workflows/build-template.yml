name: Build Template

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

      service-path:
        required: true
        type: string

      lambda-name:
        required: true
        type: string


jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: 3.12
            # usa caching de dependências para agilizar a execução do workflow
            cache: pip
            cache-dependency-path: ${{ inputs.service-path }}/requirements.txt

        - name: Install dependencies
          # usar python garante que o pip pertence ao interpretador configurado 
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r ${{ inputs.service-path }}/requirements.txt
    
        - name: Run ruff
          run: |
            ruff format --check ${{ inputs.service-path }}/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          # usa caching de dependências para agilizar a execução do workflow
          cache: pip
          cache-dependency-path: ${{ inputs.service-path }}/requirements.txt

      - name: Install dependencies
        # usar python garante que o pip pertence ao interpretador configurado 
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ inputs.service-path }}/requirements.txt
  
      - name: Run Tests
        run: |
          pytest ${{ inputs.service-path }}/tests -v

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Build lambda package
        run: |
          mkdir build
  
          pip install \
              --target build \
              -r ${{ inputs.service-path }}/requirements.txt
  
          cp -r ${{ inputs.service-path }}/src ${{ inputs.service-path }}/src
          cp ${{ inputs.service-path }}/main.py build/
          cp ${{ inputs.service-path }}/__init__.py build/

      - name: Create zip
        run: |
          cd build
          zip -r ../${{ inputs.service-name }}.zip .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload artifact to S3
        run: |
          aws s3 cp \
            ${{ inputs.service-name }}.zip \
            s3://fileuploader-zip/lambda/${{ inputs.service-name }}/${{ github.sha }}.zip