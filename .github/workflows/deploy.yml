name: Deploys AWS resources through Terraform

on: 
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  
jobs:
  deploy:
     if: ${{ github.event.workflow_run.conclusion == 'success' }}
     runs-on: ubuntu-latest
     steps:
      - name: Inicialize environments
        uses: actions/checkout@v4

      - name: Installing Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="lambda_key=lambda/${{ github.event.workflow_run.head_sha }}.zip"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="lambda_key=lambda/${{ github.event.workflow_run.head_sha }}.zip"